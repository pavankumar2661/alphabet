<!DOCTYPE html><" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>తెలుగు చిన్నపిల్లల ఆట</title>
<style>
  :root{
    --bg:#fffaf2; --ink:#262626; --card:#ffffff; --accent:#ffb703;
    --good:#2ecc71; --bad:#ff4d4f; --shadow:0 8px 28px rgba(0,0,0,.08);
  }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans Telugu",Arial}
  .wrap{max-width:900px;margin:0 auto;padding:16px 14px 32px}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px}
  h1{margin:6px 0;font-size:clamp(22px,5vw,30px);display:flex;align-items:center;gap:.5ch}
  .btn{
    border:0;border-radius:14px;padding:12px 16px;font-size:16px;font-weight:800;
    background:#ffe082;color:#4a2c00;box-shadow:var(--shadow);cursor:pointer
  }
  .btn.ghost{background:#fff;border:2px solid #e6e6e6}
  .btn.secondary{background:#e0e7ff;color:#1e2a78}
  .btn:active{transform:scale(.98)}
  .pane{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px;margin-top:12px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .tabs{display:flex;gap:8px}
  .tabs.tabs-cat{flex-wrap:wrap} /* allow category tabs to wrap on small screens */
  .tab{flex:1;text-align:center;border-radius:12px;padding:10px 12px;font-weight:800;border:2px solid #ddd;background:#fff;cursor:pointer}
  .tab.active{border-color:#8b5cf6;background:#ede9fe;color:#4c1d95}
  .divider{height:1px;background:#eee;margin:10px 0}
  #prompt{font-size:clamp(18px,4.8vw,24px);font-weight:900;margin:8px 0}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
  @media(min-width:620px){.grid{grid-template-columns:repeat(4,1fr)}}
  .card{
    background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:14px;text-align:center;
    cursor:pointer;user-select:none;transition:transform .06s, border-color .2s; border:3px solid transparent
  }
  .card:active{transform:scale(.98)}
  .emoji{font-size:clamp(46px,12vw,70px);line-height:1}
  .name{font-size:clamp(18px,5vw,22px);font-weight:900;margin-top:6px}
  .hint{font-size:clamp(13px,4vw,16px);color:#666}
  .card.good{border-color:var(--good)}
  .card.bad{border-color:var(--bad)}
  .status{min-height:1.5em;font-weight:900;margin-top:8px}
  .status.good{color:var(--good)} .status.bad{color:var(--bad)}
  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .confetti span{position:absolute;font-size:22px;animation:pop 1000ms ease-out forwards}
  @keyframes pop{
    0%{transform:translate(0,0) scale(.4) rotate(0deg);opacity:0}
    15%{opacity:1}
    100%{transform:translate(var(--x), var(--y)) scale(1) rotate(var(--r));opacity:0}
  }
  .note{color:#666;font-size:13px;text-align:center;margin-top:10px}
  .big{font-size:18px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧒 తెలుగు చిన్నపిల్లల ఆట</h1>
    <div class="row">
      <button id="startAudio" class="btn secondary">🔊 సౌండ్ ప్రారంభించు</button>
      <button id="voiceToggle" class="btn">🔊 వాయిస్ ON</button>
    </div>
  </header>

  <div class="pane">
    <!-- Mode Tabs -->
    <div class="tabs" role="tablist" aria-label="Mode">
      <button id="tabFree"  class="tab active" role="tab" aria-selected="true">🎹 ఆడుకో</button>
      <button id="tabMatch" class="tab" role="tab" aria-selected="false">🎯 పెట్టి చూసే ఆట</button>
    </div>
    <div class="divider"></div>

    <!-- Category Tabs -->
    <div class="tabs tabs-cat" role="tablist" aria-label="Category">
      <button id="catColors"  class="tab active">🎨 రంగులు</button>
      <button id="catAnimals" class="tab">🐾 జంతువులు</button>
      <button id="catFruits"  class="tab">🍎 పండ్లు</button>
      <button id="catNumbers" class="tab">🔢 సంఖ్యలు</button>
      <button id="catShapes"  class="tab">🟠 ఆకారాలు</button>
    </div>

    <div id="prompt" class="big">ట్యాప్ చేస్తే పదం వినిపిస్తుంది</div>
    <div class="row">
      <button id="repeatBtn" class="btn ghost">🔈 మళ్లీ వినిపించు</button>
      <button id="nextBtn" class="btn ghost" hidden>➡️ మరొకటి</button>
    </div>

    <div id="grid" class="grid" aria-label="Choices"></div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </div>

  <div class="note">సూచన: iPhone/Android లో శబ్దం రావాలంటే ముందుగా “సౌండ్ ప్రారంభించు” బటన్‌ను ట్యాప్ చేయండి.</div>
</div>

<div id="confetti" class="confetti" aria-hidden="true"></div>

<script>
  // ====== Data (Telugu + simple transliteration) ======
  const COLORS = [
    { name:"ఎరుపు",   en:"Erupu",         emoji:"🔴" },
    { name:"నీలం",    en:"Nīlam",         emoji:"🔵" },
    { name:"ఆకుపచ్చ", en:"Ākupacca",      emoji:"🟢" },
    { name:"పసుపు",   en:"Pasupu",        emoji:"🟡" },
    { name:"నారింజ",  en:"Nārinja",       emoji:"🟠" },
  ];
  const ANIMALS = [
    { name:"కుక్క",   en:"Kukka (Dog)",     emoji:"🐶" },
    { name:"పిల్లి",  en:"Pilli (Cat)",     emoji:"🐱" },
    { name:"ఆవు",    en:"Āvu (Cow)",       emoji:"🐮" },
    { name:"ఏనుగు",  en:"Ēnugu (Elephant)",emoji:"🐘" },
    { name:"సింహం",  en:"Simham (Lion)",   emoji:"🦁" },
  ];
  const FRUITS = [
    { name:"ఆపిల్",  en:"Āpil (Apple)",   emoji:"🍎" },
    { name:"అరటి",   en:"Araṭi (Banana)", emoji:"🍌" },
    { name:"ద్రాక్ష", en:"Drākṣa (Grapes)",emoji:"🍇" },
    { name:"మామిడి", en:"Māmiḍi (Mango)", emoji:"🥭" },
    { name:"జామ",    en:"Jāma (Guava)",   emoji:"🥝" }, // closest emoji
  ];
  // NEW: Numbers 1–5
  const NUMBERS = [
    { name:"ఒకటి",   en:"Okati (One)",    emoji:"1️⃣" },
    { name:"రెండు",  en:"Rendu (Two)",    emoji:"2️⃣" },
    { name:"మూడు",   en:"Mūḍu (Three)",   emoji:"3️⃣" },
    { name:"నాలుగు", en:"Nālugu (Four)",  emoji:"4️⃣" },
    { name:"ఐదు",    en:"Aidu (Five)",    emoji:"5️⃣" },
  ];
  // NEW: Shapes (simple words for toddlers)
  const SHAPES = [
    { name:"వృత్తం",    en:"Vṛttam (Circle)",   emoji:"⭕️" },
    { name:"చదరం",     en:"Chadaram (Square)",  emoji:"🟥" },
    { name:"ముక్కోణం", en:"Mukkōṇam (Triangle)",emoji:"🔺" },
    { name:"నక్షత్రం",  en:"Nakṣatram (Star)",  emoji:"⭐️" },
    { name:"హృదయం",    en:"Hr̥dayam (Heart)",  emoji:"❤️" },
  ];

  const CATS = {
    colors:  {label:"🎨 రంగులు",   list: COLORS,  ask:"ఏది … రంగు?"},
    animals: {label:"🐾 జంతువులు", list: ANIMALS, ask:"ఏది …?"},
    fruits:  {label:"🍎 పండ్లు",   list: FRUITS,  ask:"ఏది … పండు?"},
    numbers: {label:"🔢 సంఖ్యలు",  list: NUMBERS, ask:"ఏది … సంఖ్య?"},
    shapes:  {label:"🟠 ఆకారాలు",  list: SHAPES,  ask:"ఏది … ఆకారం?"},
  };

  // ====== Helpers ======
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  function shuffle(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);}
  function sample(arr,n){return shuffle([...arr]).slice(0,n);}

  let voiceOn = true, unlocked = false, teVoice = null;
  let mode = 'free'; // 'free' | 'match'
  let cat = 'colors';
  let currentTarget = null; // for match mode

  // Voice
  function pickTeluguVoice(){
    const voices = speechSynthesis.getVoices();
    teVoice = voices.find(v => (v.lang||'').toLowerCase().startsWith('te'));
    return teVoice;
  }
  speechSynthesis.onvoiceschanged = pickTeluguVoice;

  function speak(textTe, fallbackEn){
    if(!voiceOn || !unlocked) return;
    try{
      const u = new SpeechSynthesisUtterance(textTe);
      u.lang = teVoice ? teVoice.lang : 'te-IN';
      if(teVoice) u.voice = teVoice;
      u.rate = 0.9; u.pitch = 1.0;
      if(!teVoice && fallbackEn){ u.text = fallbackEn; u.lang = 'en-US'; }
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }catch(e){/* ignore */}
  }
  function vibrate(p=[40]){ if(navigator.vibrate) navigator.vibrate(p); }

  // Confetti
  function confettiBurst(){
    const box = $('#confetti');
    for(let i=0;i<22;i++){
      const s = document.createElement('span');
      s.textContent = (i%3===0?'🎉':(i%3===1?'⭐':'✨'));
      const dx = (Math.random()*2-1)*160;
      const dy = - (120 + Math.random()*140);
      const rot = (Math.random()*2-1)*540 + 'deg';
      s.style.left = (Math.random()*window.innerWidth)+'px';
      s.style.top  = (window.innerHeight-40)+'px';
      s.style.setProperty('--x', dx+'px');
      s.style.setProperty('--y', dy+'px');
      s.style.setProperty('--r', rot);
      box.appendChild(s);
      setTimeout(()=> s.remove(), 1000);
    }
  }

  // UI builders
  function makeCard(item, onTap){
    const btn = document.createElement('button');
    btn.className = 'card';
    btn.setAttribute('aria-label', item.name);
    btn.innerHTML = `
      <div class="emoji">${item.emoji}</div>
      <div class="name">${item.name}</div>
      <div class="hint">${item.en}</div>
    `;
    btn.addEventListener('click', ()=> onTap(item, btn));
    return btn;
  }

  function setTabs(){
    // Mode
    $('#tabFree').classList.toggle('active', mode==='free');
    $('#tabMatch').classList.toggle('active', mode==='match');
    // Categories
    $('#catColors').classList.toggle('active',  cat==='colors');
    $('#catAnimals').classList.toggle('active', cat==='animals');
    $('#catFruits').classList.toggle('active',  cat==='fruits');
    $('#catNumbers').classList.toggle('active', cat==='numbers');
    $('#catShapes').classList.toggle('active',  cat==='shapes');
  }

  function renderFree(){
    $('#prompt').textContent = 'ట్యాప్ చేస్తే పదం వినిపిస్తుంది';
    $('#nextBtn').hidden = true;
    $('#status').textContent = '';
    const list = CATS[cat].list;
    const grid = $('#grid'); grid.innerHTML = '';
    list.forEach(item=>{
      const card = makeCard(item, (it)=>{
        speak(it.name, it.en);
        vibrate([30]);
      });
      grid.appendChild(card);
    });
  }

  function renderMatch(){
    $('#status').textContent = '';
    $('#nextBtn').hidden = false;
    const list = CATS[cat].list;
    const choices = sample(list, Math.min(3, list.length));
    currentTarget = sample(choices,1)[0];

    // Prompt (e.g., "ఏది ఎరుపు రంగు?" / "ఏది మూడు సంఖ్య?" / "ఏది వృత్తం ఆకారం?")
    const ask = CATS[cat].ask.replace('…', currentTarget.name);
    $('#prompt').textContent = ask;
    speak(ask, `Which is ${currentTarget.en}?`);

    // Grid
    const grid = $('#grid'); grid.innerHTML = '';
    choices.forEach(item=>{
      const card = makeCard(item, (picked, el)=>{
        if(picked.name === currentTarget.name){
          el.classList.add('good');
          $('#status').textContent = '✅ బాగుంది!';
          $('#status').className = 'status good';
          speak('చాలా బాగుంది!', 'Great job!');
          vibrate([40,60,80]);
          confettiBurst();
          setTimeout(renderMatch, 1200);
        }else{
          el.classList.add('bad');
          $('#status').textContent = '❌ మళ్లీ ప్రయత్నించు';
          $('#status').className = 'status bad';
          speak('మళ్లీ ప్రయత్నించు', 'Try again');
          vibrate([60]);
          setTimeout(()=> el.classList.remove('bad'), 600);
        }
      });
      grid.appendChild(card);
    });
  }

  function render(){
    setTabs();
    if(mode==='free') renderFree(); else renderMatch();
  }

  // ====== Event wiring ======
  $('#tabFree').addEventListener('click', ()=>{ mode='free'; render(); });
  $('#tabMatch').addEventListener('click', ()=>{ mode='match'; render(); });

  $('#catColors').addEventListener('click',  ()=>{ cat='colors';  render(); });
  $('#catAnimals').addEventListener('click', ()=>{ cat='animals'; render(); });
  $('#catFruits').addEventListener('click',  ()=>{ cat='fruits';  render(); });
  $('#catNumbers').addEventListener('click', ()=>{ cat='numbers'; render(); });
  $('#catShapes').addEventListener('click',  ()=>{ cat='shapes';  render(); });

  $('#repeatBtn').addEventListener('click', ()=>{
    if(mode==='free'){
      speak('తప్పకుండా!', 'Again');
    }else if(currentTarget){
      const ask = CATS[cat].ask.replace('…', currentTarget.name);
      speak(ask, `Which is ${currentTarget.en}?`);
    }
  });

  $('#nextBtn').addEventListener('click', ()=> renderMatch());

  // Audio unlock + voice toggle
  $('#startAudio').addEventListener('click', ()=>{
    unlocked = true;
    pickTeluguVoice();
    speak('ప్రారంభిద్దాం!', 'Let us start!');
  });
  $('#voiceToggle').addEventListener('click', ()=>{
    voiceOn = !voiceOn;
    $('#voiceToggle').textContent = voiceOn ? '🔊 వాయిస్ ON' : '🔇 వాయిస్ OFF';
    if(!voiceOn) speechSynthesis.cancel();
    else speak('వాయిస్ ఆన్', 'Voice on');
  });

  // First paint
  window.addEventListener('load', render);
</script>
</body>
</html>
<html lang="te">
<head>
<meta charset="utf-8" />
