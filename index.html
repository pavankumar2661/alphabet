
<!DOCTYPE html>
<html>
<head>
<title>Color Tap Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #f7f7f7;
        margin: 0;
        padding: 20px;
    }

    h1 {
        font-size: 28px;
        color: #333;
    }

    #question {
        font-size: 24px;
        margin: 20px 0;
        font-weight: bold;
    }

    .colors {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 20px;
        flex-wrap: wrap;
    }

    .color-btn {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 4px solid #333;
        cursor: pointer;
    }

    #result {
        margin-top: 25px;
        font-size: 26px;
        font-weight: bold;
    }
</style>
</head>
<body>

<h1>🎨 Color Tap Game</h1>

<div id="question">Loading...</div>

<div class="colors">
    <div class="color-btn" id="red" style="background:red"></div>
    <div class="color-btn" id="blue" style="background:blue"></div>
    <div class="color-btn" id="green" style="background:green"></div>
    <div class="color-btn" id="yellow" style="background:yellow"></div>
</div>

<div id="result"></div>

<script>
    const colors = ["red", "blue", "green", "yellow"];

    function newRound() {
        const pick = colors[Math.floor(Math.random() * colors.length)];
        document.getElementById("question").innerText =
            "Tap the " + pick.toUpperCase() + " circle!";
        speak("Tap the " + pick + " circle");
        return pick;
    }

    let answer = newRound();

    document.querySelectorAll(".color-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            if (btn.id === answer) {
                document.getElementById("result").innerText = "✔ Correct!";
                speak("Good job!");
            } else {
                document.getElementById("result").innerText = "❌ Try again!";
                speak("Try again");
            }
            setTimeout(() => {
                document.getElementById("result").innerText = "";
                answer = newRound();
            }, 1200);
        });
    });

    function speak(text) {
        let msg = new SpeechSynthesisUtterance(text);
        speechSynthesis.speak(msg);
    }
</script>

</body>
</html>
